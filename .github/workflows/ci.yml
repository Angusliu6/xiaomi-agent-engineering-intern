name: unit-tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
      - run: python -m traceqa eval --variant b0 --out reports/b0.json
      - run: python -m traceqa eval --variant b1 --out reports/b1.json
      - run: python -m traceqa compare reports/b0.json reports/b1.json
      - run: python -m traceqa eval --cases data/stress_hard_negative.jsonl --variant b0 --out reports/stress-b0.json
      - run: python -m traceqa eval --cases data/stress_hard_negative.jsonl --variant b2 --out reports/stress-b2.json
      - run: python -m traceqa compare reports/stress-b0.json reports/stress-b2.json
      - run: python -m traceqa eval --cases data/stress_hard_negative.jsonl --variant b3 --out reports/stress-b3.json
      - run: python -m traceqa compare reports/stress-b2.json reports/stress-b3.json
