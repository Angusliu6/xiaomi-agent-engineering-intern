[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceqa-agent"
version = "0.2.0"
description = "Evidence-grounded engineering incident agent with reproducible offline evaluation"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
traceqa = "traceqa.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
